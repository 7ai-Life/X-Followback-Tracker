<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Followback Tracker</title><style>:root{color-scheme:light;--ink:#142033;--muted:#718092;--line:#e6ebf0;--accent:#138f88}
*{box-sizing:border-box}body{width:360px;margin:0;padding:24px;color:var(--ink);background:#fff;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:13px;margin-bottom:25px}.logo{width:48px;height:48px;flex-shrink:0;border-radius:12px}.eyebrow{font-size:9px;letter-spacing:1.3px;font-weight:750;margin:0 0 3px;color:#56677c}h1{font-size:20px;letter-spacing:-.4px;line-height:1.3;margin:0}.subtitle{margin:4px 0 0;color:var(--muted);font-size:11px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:650;cursor:pointer}.switch-row small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:2px}input[type=checkbox]{appearance:none;width:38px;height:22px;margin:0;flex-shrink:0;border-radius:20px;background:#cbd5df;position:relative;cursor:pointer;transition:background .15s}input[type=checkbox]:before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:transform .15s}input[type=checkbox]:checked{background:var(--accent)}input[type=checkbox]:checked:before{transform:translateX(16px)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.summary{background:#f5f8fa;border:1px solid #edf1f4;border-radius:14px;padding:15px 12px;margin:20px 0}#status{font-size:11px;color:#617084;margin:0 0 14px;line-height:1.5}.counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.counts>div+div{border-left:1px solid #e3e9ef}.counts strong{display:block;font-size:27px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin-bottom:6px}.counts span{color:#667689;font-size:10px}#missing{color:#ed3c59}#mutual{color:var(--accent)}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle}.pink{background:#ed3c59}.mint{background:var(--accent)}
form label{font-weight:600;font-size:12px}label small{color:var(--muted);font-weight:400;font-size:10px;margin-left:4px}.input-row{display:flex;gap:8px;margin-top:8px}input:not([type]){width:100%;min-width:0;border:1px solid #dbe3eb;border-radius:8px;padding:9px 11px;font:inherit;color:var(--ink);background:white}button{border:0;border-radius:8px;background:var(--ink);color:white;padding:0 16px;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.5;cursor:pointer}button:hover{background:#29405d}#saved{font-size:11px;min-height:16px;margin:4px 0;color:var(--accent)}.note{font-size:10px;line-height:1.75;color:#768395;margin:7px 0 18px}footer{border-top:1px solid var(--line);padding-top:14px}.creator{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}a{color:var(--ink);text-decoration:none;font-weight:650}a:hover{color:var(--accent);text-decoration:underline}.version{font-size:9px;color:#8592a2;background:#f3f6f8;border-radius:4px;padding:1px 5px}footer p{color:#8792a0;font-size:9px;margin:7px 0 0}
@media(prefers-reduced-motion:reduce){input[type=checkbox],input[type=checkbox]:before{transition:none}}
body{margin:24px auto;border:1px solid #e6ebf0;border-radius:18px;box-shadow:0 16px 45px #1420330b}html{background:#f5f7fa}</style></head>
